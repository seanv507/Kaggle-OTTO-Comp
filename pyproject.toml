[project]
name = "otto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.22.9",
    "boto3>=1.38.18",
    "cudf-polars-cu13>=26.10",
    "graphviz>=0.20.3",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.2",
    "lifetimes>=0.11.3",
    "loguru>=0.7.3",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "polars-ds>=0.10.4",
    "polars[all]>=1.44,<1.45",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
    "xgboost>=3.4.1",
]



[project.optional-dependencies]
cpu = [
  "torch>=2.15",
  "torchvision>=0.29.0",
]
cu132 = [
  "torch>=2.15",
  "torchvision>=0.29.0",
]


[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu132" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu132", extra = "cu132" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu132", extra = "cu132" },
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true


[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "plotnine>=0.14.5",
    "pytest>=8.3.5",
    "ruff>=0.11.10",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Editable install that puts the repo root on sys.path, so modules in
# train/... and data/ can import shared root modules such as event_types.
# train/covisit_matrices is on it too, so that other projects (Benny's repo, as an
# editable uv path dependency) can `import covisits`. Not with a wheel's force-include:
# hatch copies those files into editable installs too, and the copy then shadows edits.
[tool.hatch.build]
dev-mode-dirs = [".", "train/covisit_matrices"]

[tool.hatch.build.targets.wheel]
only-include = ["event_types.py"]

[tool.pytest.ini_options]
pythonpath = ["."]


[tool.ruff.lint]
extend-select = ["B"]

